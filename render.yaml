services:
  # 1. Main API Web Service (Render Web Service)
  - type: web
    name: gugu-farmmind-api
    runtime: node
    plan: starter
    buildCommand: npm install && npm run build && (pip install -r requirements.txt || true)
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: GEMINI_API_KEY
        sync: false
      - key: KAGGLE_USERNAME
        sync: false
      - key: KAGGLE_API_TOKEN
        sync: false
      - key: AUTO_SUBMIT
        value: "false"
      - key: DATABASE_URL
        sync: false

  # 2. Autonomous Strategy Optimization Engine (Render Background Worker)
  - type: worker
    name: gugu-farmmind-optimizer-worker
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt || true
    startCommand: python3 optimize.py
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: KAGGLE_USERNAME
        sync: false
      - key: KAGGLE_API_TOKEN
        sync: false
      - key: AUTO_SUBMIT
        value: "false"
      - key: DATABASE_URL
        sync: false

# Scheduled Cron Jobs on Render
cronjobs:
  - name: kaggle-replay-monitor
    schedule: "0 */2 * * *"  # Every 2 hours
    command: python3 analyze_replay.py
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: KAGGLE_USERNAME
        sync: false
      - key: KAGGLE_API_TOKEN
        sync: false
      - key: DATABASE_URL
        sync: false
